# Grendel goreleaser configs
# See here: https://goreleaser.com
version: 2
before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run ./cmd/grendeld completion bash > completions/grendeld.bash'
    - sh -c 'go run ./cmd/grendeld completion zsh > completions/grendeld.zsh'
    - sh -c 'go run ./cmd/grendeld completion fish > completions/grendeld.fish'
    - sh -c 'go run ./cmd/grendel completion bash > completions/grendel.bash'
    - sh -c 'go run ./cmd/grendel completion zsh > completions/grendel.zsh'
    - sh -c 'go run ./cmd/grendel completion fish > completions/grendel.fish'
builds:
  - id: grendeld
    main: ./cmd/grendeld
    binary: grendeld
    env:
      - CGO_ENABLED=1
    goarch:
      - amd64
    goos:
      - linux
    ldflags:
      - -s -w -X github.com/ubccr/grendel/internal/version.Version={{.Version}}
      - -extldflags=-static
    tags:
      - sqlite_omit_load_extension
      - osusergo
      - netgo
      - pxe
  - id: grendel
    main: ./cmd/grendel
    binary: grendel
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
    goos:
      - linux
    ldflags:
      - -s -w -X github.com/ubccr/grendel/internal/version.Version={{.Version}}
    tags:
      - osusergo
      - netgo
archives:
  - ids:
      - grendeld
      - grendel
    formats:
      - tar.gz
    wrap_in_directory: true
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSES/*
      - NOTICE
      - README.md
      - CHANGELOG.md
      - configs/grendel.toml.sample
      - completions/*
dockers_v2:
  - id: grendel
    ids:
      - grendeld
      - grendel
    images:
      - ubccr/grendel
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
    extra_files:
      - configs/grendel.toml.sample
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Bare Metal Provisioning for HPC
      org.opencontainers.image.url: https://github.com/ubccr/grendel
      org.opencontainers.image.source: https://github.com/ubccr/grendel
      org.opencontainers.image.documentation: https://grendel.readthedocs.io
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: GPL-3.0-or-later
nfpms:
  - ids:
      - grendeld
      - grendel
    vendor: University at Buffalo
    homepage: https://github.com/ubccr/grendel
    maintainer: Andrew E. Bruno <aebruno2@buffalo.edu>
    license: GPLv3
    description: |-
      Bare Metal Provisioning for HPC
    formats:
      - deb
      - rpm
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    scripts:
      postinstall: ./scripts/nfpm/postinstall.sh
    contents:
      - src: ./configs/grendel.toml.sample
        dst: /etc/grendel/grendel.toml
        type: "config|noreplace"
      - src: ./scripts/nfpm/grendel.service
        dst: /usr/lib/systemd/system/grendel.service
      - src: ./completions/grendeld.bash
        dst: /usr/share/bash-completion/completions/grendeld
        file_info:
          mode: 0644
      - src: ./completions/grendeld.zsh
        dst: /usr/share/zsh/site-functions/_grendeld
        file_info:
          mode: 0644
      - src: ./completions/grendeld.fish
        dst: /usr/share/fish/vendor_completions.d/grendeld.fish
        file_info:
          mode: 0644
      - src: ./completions/grendel.bash
        dst: /usr/share/bash-completion/completions/grendel
        file_info:
          mode: 0644
      - src: ./completions/grendel.zsh
        dst: /usr/share/zsh/site-functions/_grendel
        file_info:
          mode: 0644
      - src: ./completions/grendel.fish
        dst: /usr/share/fish/vendor_completions.d/grendel.fish
        file_info:
          mode: 0644
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{.ShortCommit}}"
changelog:
  sort: desc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "typo"
release:
  draft: true
  mode: append
  include_meta: false
